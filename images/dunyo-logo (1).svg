<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9dde0"/>
      <stop offset="0.55" stop-color="#9ea5aa"/>
      <stop offset="1" stop-color="#e8ebed"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#06201a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Black frame + dark green panel -->
  <rect x="40" y="40" width="1120" height="520" rx="28" fill="#0a0a0a"/>
  <rect x="70" y="70" width="1060" height="460" rx="14" fill="url(#panel)"/>
  <rect x="70" y="70" width="1060" height="460" rx="14" fill="url(#glow)"/>

  <!-- Dunyo -->
  <text x="600" y="345" text-anchor="middle"
        font-family="'Poppins','Montserrat','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif"
        font-size="230" font-weight="700" letter-spacing="4"
        fill="url(#silver)">Dunyo</text>

  <!-- restaurant -->
  <text x="600" y="440" text-anchor="middle"
        font-family="'Poppins','Montserrat','Helvetica Neue',Arial,sans-serif"
        font-size="58" font-weight="500" letter-spacing="14"
        fill="url(#silver)">restaurant</text>
</svg>
